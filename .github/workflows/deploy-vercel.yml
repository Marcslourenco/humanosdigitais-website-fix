name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Force Clean and Create .vercel
        run: |
          # Força a remoção de qualquer .vercel que venha do histórico do Git
          rm -rf .vercel
          mkdir -p .vercel
          # Cria o arquivo apenas com o Project ID (Org ID não é necessário para conta pessoal e pode causar conflito)
          echo '{"projectId": "${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json
          echo "✅ .vercel/project.json limpo e criado com sucesso"

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --project="${{ secrets.VERCEL_PROJECT_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
